<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - PocketSmart AI</title>
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="background: #f8fafc;">

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <a href="/" class="brand" style="justify-content: center; margin-bottom: 0.5rem;">
          <div class="brand-icon"><i class="fa-solid fa-wallet"></i></div>
          <span>PocketSmart</span>
        </a>
        <div class="auth-subtitle">AI-Powered Budget Planning</div>
        <h2 class="auth-title">Welcome Back</h2>
      </div>

      {% if error %}
        <div style="background: var(--danger-light); color: var(--danger); padding: 0.75rem 1rem; border-radius: var(--radius-sm); margin-bottom: 1.25rem; font-size: 0.9rem; font-weight: 600;">
          <i class="fa-solid fa-circle-exclamation"></i> {{ error }}
        </div>
      {% endif %}

      <form action="/login" method="POST">
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <div style="position: relative;">
            <i class="fa-solid fa-user" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: #94a3b8;"></i>
            <input type="text" id="username" name="username" class="form-input" style="padding-left: 2.75rem;" placeholder="Enter your username" value="{{ username or 'sai' }}" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div style="position: relative;">
            <i class="fa-solid fa-lock" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: #94a3b8;"></i>
            <input type="password" id="password" name="password" class="form-input" style="padding-left: 2.75rem;" placeholder="Enter your password" value="password123" required>
          </div>
        </div>

        <div style="display: flex; justify-content: flex-end; margin-bottom: 1.5rem;">
          <a href="#" style="font-size: 0.85rem; color: var(--primary); font-weight: 600;">Forgot Password?</a>
        </div>

        <button type="submit" class="btn btn-primary btn-block" style="padding: 0.85rem;">
          Sign In <i class="fa-solid fa-arrow-right"></i>
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.75rem; font-size: 0.9rem; color: var(--text-muted);">
        Don't have an account? <a href="/register" style="color: var(--primary); font-weight: 700;">Create Account</a>
      </div>

      <div style="margin-top: 1.5rem; padding: 0.75rem; background: #f1f5f9; border-radius: var(--radius-sm); font-size: 0.8rem; color: #475569; text-align: center;">
        <i class="fa-solid fa-info-circle"></i> Demo credentials prefilled: <strong>sai</strong> / <strong>password123</strong>
      </div>
    </div>
  </div>

</body>
</html>
