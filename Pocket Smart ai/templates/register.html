<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - PocketSmart AI</title>
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="background: #f8fafc;">

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <a href="/" class="brand" style="justify-content: center; margin-bottom: 0.5rem;">
          <div class="brand-icon"><i class="fa-solid fa-wallet"></i></div>
          <span>PocketSmart</span>
        </a>
        <div class="auth-subtitle">AI-Powered Budget Planning</div>
        <h2 class="auth-title">Create Your Account</h2>
      </div>

      {% if error %}
        <div style="background: var(--danger-light); color: var(--danger); padding: 0.75rem 1rem; border-radius: var(--radius-sm); margin-bottom: 1.25rem; font-size: 0.9rem; font-weight: 600;">
          <i class="fa-solid fa-circle-exclamation"></i> {{ error }}
        </div>
      {% endif %}

      <form action="/register" method="POST">
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <div style="position: relative;">
            <i class="fa-solid fa-user" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: #94a3b8;"></i>
            <input type="text" id="username" name="username" class="form-input" style="padding-left: 2.75rem;" placeholder="Choose a username" value="{{ username or '' }}" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <div style="position: relative;">
            <i class="fa-solid fa-envelope" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: #94a3b8;"></i>
            <input type="email" id="email" name="email" class="form-input" style="padding-left: 2.75rem;" placeholder="Enter your email" value="{{ email or '' }}" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="full_name">Full Name (Optional)</label>
          <div style="position: relative;">
            <i class="fa-solid fa-id-card" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: #94a3b8;"></i>
            <input type="text" id="full_name" name="full_name" class="form-input" style="padding-left: 2.75rem;" placeholder="Your full name" value="{{ full_name or '' }}">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div style="position: relative;">
            <i class="fa-solid fa-lock" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: #94a3b8;"></i>
            <input type="password" id="password" name="password" class="form-input" style="padding-left: 2.75rem;" placeholder="Create a strong password" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirm_password">Confirm Password</label>
          <div style="position: relative;">
            <i class="fa-solid fa-shield-halved" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: #94a3b8;"></i>
            <input type="password" id="confirm_password" name="confirm_password" class="form-input" style="padding-left: 2.75rem;" placeholder="Confirm your password" required>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block" style="padding: 0.85rem; margin-top: 1.5rem;">
          Create Account <i class="fa-solid fa-user-plus"></i>
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.75rem; font-size: 0.9rem; color: var(--text-muted);">
        Already have an account? <a href="/login" style="color: var(--primary); font-weight: 700;">Sign In</a>
      </div>
    </div>
  </div>

</body>
</html>
